; Snake on a 4.0" 480x320 SPI TFT
;
; There are three supported TFT driver chips: ST7796S, ILI9486, and ILI9488. 
; The default is ST7796S. To use a different driver, use one of the upload commands below in the terminal.
; One environment per TFT driver chip:
;   pio run -t upload               ST7796S (the default)
;   pio run -e ili9486 -t upload    ILI9486
;   pio run -e ili9488 -t upload    ILI9488

[platformio]
default_envs = st7796s

[env]
platform = atmelavr
board = uno
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
upload_protocol = arduino
upload_speed = 115200
; upload_port = COM3            ; uncomment if auto-detect picks the wrong port

[env:st7796s]
build_flags = -Wall -Wextra -DTFT_DRIVER=TFT_ST7796S

[env:ili9486]
build_flags = -Wall -Wextra -DTFT_DRIVER=TFT_ILI9486

[env:ili9488]
build_flags = -Wall -Wextra -DTFT_DRIVER=TFT_ILI9488
