[platformio]
default_envs = part1

; Settings shared by all three exercises
[env]
platform = atmelavr
board = uno
framework = arduino
; upload_port = COM3        ; uncomment and set if auto-detect picks the wrong port

[env:part1]
build_src_filter = -<*> +<shash032_lab7_part1.cpp>

[env:part2]
build_src_filter = -<*> +<shash032_lab7_part2.cpp>

[env:part3]
build_src_filter = -<*> +<shash032_lab7_part3.cpp>
